name = "mistdory-view-counter"
main = "worker.mjs"
compatibility_date = "2026-11-12"
workers_dev = true

[vars]
SITE_ORIGIN = "https://mphcat.github.io"

[observability]
enabled = false

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mistdory-view-counter"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"